name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    # Dummy values only: CI never needs real secrets
    env:
      DATABASE_URL: file:./ci.db
      JWT_SECRET: ci-only-not-a-real-secret
      NODE_ENV: test
      PORT: 5001
      AIMLAPI_KEY: ci-dummy
      AIMLAPI_BASE_URL: https://api.aimlapi.com/v1
      AIMLAPI_MODEL: ci-dummy

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Install client dependencies
        run: npm ci --prefix client

      - name: Set up database
        working-directory: server
        run: |
          npx prisma generate
          npx prisma migrate deploy
          npm run db:seed

      - name: Start API server
        working-directory: server
        run: |
          npm start > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:5001/api/health && exit 0
            sleep 1
          done
          echo "Server did not start:"; cat server.log; exit 1

      - name: Run permission tests
        run: node scripts/test-phase2.mjs

      - name: Build client
        run: npm run build --prefix client

      - name: Show server log on failure
        if: failure()
        run: cat server/server.log || true